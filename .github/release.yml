# Release notes categorization (conventional-commits style, like
# googleapis/release-please). GitHub buckets merged PRs into these
# categories by label when notes are auto-generated; the human-written
# CHANGELOG.md section for the tag is prepended by the Release workflow.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - github-actions
      - renovate
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
        - feat
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: ⚡ Performance
      labels:
        - performance
        - perf
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: ✅ Testing
      labels:
        - test
        - tests
        - testing
    - title: 🔧 Maintenance
      labels:
        - chore
        - refactor
        - ci
        - build
    - title: 📦 Dependencies
      labels:
        - dependencies
        - deps
    - title: Other Changes
      labels:
        - "*"
