# Auto-generated release notes template.
# GitHub buckets merged PRs into these categories by label when a release is
# created with "generate_release_notes" (see .github/workflows/release.yml).
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: ⚡ Performance
      labels:
        - performance
    - title: 📖 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance
      labels:
        - chore
        - dependencies
        - ci
    - title: Other changes
      labels:
        - "*"
