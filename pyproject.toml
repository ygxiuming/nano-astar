[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.4", "cmake >=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "nano-astar"
version = "0.1.1"
description = "Tiny, fast A* pathfinding on occupancy grids: C++ core, bucket queue for integer costs, nanobind bindings, GIL-free."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nano-astar authors" }]
keywords = ["a-star", "astar", "pathfinding", "grid", "occupancy-grid", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-benchmark>=4",
    "matplotlib>=3.7",
    "pillow>=9",
    "networkx>=3.0",
    "build>=1",
    "twine>=4",
]

[project.urls]
Homepage = "https://github.com/ygxiuming/nano-astar"
Repository = "https://github.com/ygxiuming/nano-astar"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["src/python/nano_astar"]
sdist.include = ["src/cpp/*", "tests/*", "tools/*", "examples/*", "docs/*"]
